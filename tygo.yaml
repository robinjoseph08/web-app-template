# Generates TypeScript types from the Go types the frontend uses. Add each
# package's types.go here as it gains request or response types.
type_mappings:
  time.Time: "string /* RFC3339 */"
  time.Duration: "number /* nanoseconds */"

packages:
  - path: "github.com/robinjoseph08/web-app-template/pkg/version"
    output_path: "app/types/generated/version.ts"
    include_files:
      - "types.go"
